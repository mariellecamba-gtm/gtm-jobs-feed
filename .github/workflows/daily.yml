name: GTM Jobs Feed

on:
  schedule:
    - cron: "0 6 * * 1"    # Mondays 06:00 UTC (primary)
    - cron: "0 14 * * 1"   # Mondays 14:00 UTC (backup — catches up if the 06:00 run couldn't get a runner
                           #  or was rate-limited; stands down for 0 API requests if 06:00 already fetched)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no issues, no Aimfox, no state commit)"
        type: boolean
        default: false

concurrency:
  group: gtm-jobs-feed
  cancel-in-progress: false

permissions:
  contents: write   # commit state/seen.json back
  issues: write     # open one issue per job post

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run feed
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          BLITZ_API_KEY: ${{ secrets.BLITZ_API_KEY }}
          AIMFOX_API_KEY: ${{ secrets.AIMFOX_API_KEY }}
          AIMFOX_CAMPAIGN_ID: ${{ secrets.AIMFOX_CAMPAIGN_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # Optional repo variable — RapidAPI requests one run may spend. Unset falls back to the
          # script default (15), which fits a 75-requests/month plan across 5 possible Mondays.
          MAX_REQUESTS: ${{ vars.MAX_REQUESTS }}
          RUN_TIMESTAMP: ${{ github.run_id }}
        run: node scripts/run.mjs

      - name: Commit updated dedupe state
        if: ${{ !inputs.dry_run }}
        run: |
          if [[ -n "$(git status --porcelain state/seen.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/seen.json
            git commit -m "chore: update dedupe state [skip ci]"
            git push
          else
            echo "no state change"
          fi
