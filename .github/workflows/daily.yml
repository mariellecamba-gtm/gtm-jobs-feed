name: GTM Jobs Feed

on:
  schedule:
    - cron: "0 6 * * 1"    # Mondays 06:00 UTC (primary)
    - cron: "0 14 * * 1"   # Mondays 14:00 UTC (backup — catches up if the 06:00 run couldn't get a runner
                           #  or was rate-limited; stands down for 0 API requests if 06:00 already fetched)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no issues, no Aimfox, no state commit)"
        type: boolean
        default: false
      recent_days:
        description: "Lookback window in days (scheduled runs stay at 7)"
        type: string
        default: "7"

concurrency:
  group: gtm-jobs-feed
  cancel-in-progress: false

permissions:
  contents: write   # commit state/seen.json back
  issues: write     # open one issue per job post

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run feed
        env:
          BLITZ_API_KEY: ${{ secrets.BLITZ_API_KEY }}
          GETLEADS_API_KEY: ${{ secrets.GETLEADS_API_KEY }}
          PROSPEO_API_KEY: ${{ secrets.PROSPEO_API_KEY }}
          AIMFOX_API_KEY: ${{ secrets.AIMFOX_API_KEY }}
          AIMFOX_CAMPAIGN_ID: ${{ secrets.AIMFOX_CAMPAIGN_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          RECENT_DAYS: ${{ github.event.inputs.recent_days || '7' }}
          RUN_TIMESTAMP: ${{ github.run_id }}
        run: node scripts/run.mjs

      # Commit even when the feed step failed so lastOkRun / seen.json persist.
      # GitHub disables a scheduled workflow after 60 days of repository
      # INACTIVITY, and its own cron runs do not count — last-run.txt is the
      # heartbeat commit.
      - name: Persist state (and keep the schedule alive)
        if: ${{ always() && !inputs.dry_run }}
        run: |
          date -u +"last run: %Y-%m-%dT%H:%M:%SZ (${{ job.status }})" > last-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-run.txt state/seen.json
          git diff --staged --quiet || git commit -m "chore: update run state [skip ci]"
          git push
